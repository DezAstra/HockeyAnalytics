<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Hockey Analytics</title>

    <link rel="stylesheet" href="/static/styles.css">
</head>
<body>

<div class="container">

    <div class="title">
        Hockey Analytics
    </div>

    <div class="subtitle">
        NHL analytics platform
    </div>

    <div class="filters">
        <select id="seasonSelect">
            <option value="25/26">25/26</option>
            <option value="24/25">24/25</option>
            <option value="23/24">23/24</option>
            <option value="22/23">22/23</option>
            <option value="16/17">16/17</option>
        </select>
    </div>

    <div class="top-panel">

        <input
            id="searchInput"
            type="text"
            placeholder="Поиск игрока..."
        >

        <select id="sortSelect">

            <option value="overall">
                Overall
            </option>

            <option value="normalized">
                Normalized
            </option>

            <option value="context">
                Context
            </option>

            <option value="percentile">
                Percentile
            </option>
        </select>
    </div>

    <table>
        <thead>
            <tr>
                <th>Игрок</th>
                <th>Команда</th>
                <th>Позиция</th>

                <th>Normalized</th>
                <th>Context</th>
                <th>Overall</th>

                <th>Percentile</th>

                <th>Архетип</th>
            </tr>
        </thead>

        <tbody id="playersTable"></tbody>
    </table>

</div>

<script src="/static/app.js"></script>

</body>
</html>
