<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Hockey Analytics</title>

    <link rel="stylesheet" href="/static/styles.css">
</head>
<body>

<div class="container">

    <div class="title">
        Hockey Analytics
    </div>

    <div class="subtitle">
        Аналитическая платформа 
    </div>

    <div class="filters">

    </div>

    <div class="filters">

        <input
            type="text"
            id="searchInput"
            placeholder="Искать игрока..."
        >

        <select id="seasonSelect">
            <option value="25/26">25/26</option>
            <option value="24/25">24/25</option>
            <option value="23/24">23/24</option>
            <option value="22/23">22/23</option>
            <option value="21/22">21/22</option>
            <option value="20/21">20/21</option>
            <option value="19/20">19/20</option>
            <option value="18/19">18/19</option>
            <option value="17/18">17/18</option>
            <option value="16/17">16/17</option>
        </select>

        <select id="positionFilter">

            <option value="">Позиции</option>

            <option value="C">Центр</option>
            <option value="L">Левый нап</option>
            <option value="R">Правый нап</option>
            <option value="D">Защитник</option>

        </select>

        <select id="teamFilter">
            <option value=""></option>
        </select>

        <select id="archetypeFilter">

            <option value="">Все архетипы</option>

            <option value="Ассистент">Ассистент</option>
            <option value="Снайпер">Снайпер</option>
            <option value="Бомбардир">Бомбардир</option>
            <option value="Защитник-стена">Защитник-стена</option>
            <option value="Атакующий защитник">Атакующий защитник</option>
            <option value="Нарушитель">Нарушитель</option>
            <option value="Силовик">Силовик</option>
            <option value="Специалист по вбрасываниям">Специалист по вбрасываниям</option>

        </select>

    </div>

    <div class="table-wrapper">
        <table>
            <thead>
                <tr>
                    <th>Игрок</th>
                    <th>Команда</th>
                    <th>Позиция</th>

                    <th data-sort="normalized_score">Normalized</th>
                    <th data-sort="context_score">Context</th>
                    <th data-sort="overall_score">Overall</th>

                    <th data-sort="overall_percentile">Percentile</th>

                    <th>Архетип</th>
                </tr>
            </thead>

            <tbody id="playersTable"></tbody>
        </table>
    </div>

</div>

<script src="/static/app.js"></script>

</body>
</html>
