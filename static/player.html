<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">

    <title>Player</title>

    <link rel="stylesheet" href="/static/styles.css">

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>

<div class="container">

    <button
        class="back-button"
        onclick="history.back()"
    >
        ← Back
    </button>

    <div
        id="playerCard"
        class="card"
    >
    </div>

            <div class="season-selector-container">
            <label for="seasonSelect">Сезон аналитики:</label>
            <select id="seasonSelect" class="dark-dropdown">
            </select>
        </div>

    <div
        id="similarPlayers"
        class="card"
    ></div>

    <div class="card">

        <canvas id="careerChart"></canvas>

    </div>

    <div class="card">

        <h2>
            Compare Player
        </h2>

        <div class="compare-search">

            <input
                type="text"
                id="compareInput"
                placeholder="Compare with player..."
            >

            <div id="compareResults"></div>

        </div>

    </div>

</div>

<script src="/static/player.js"></script>

</body>
</html>
