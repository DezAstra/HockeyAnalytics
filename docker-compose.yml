services:
  app:
    build: .
    container_name: hockey-analytics-app
    ports:
      - "8080:8080"
    environment:
      DB_HOST: db
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_NAME: hockey_analytics
      DB_PORT: 5432
      DB_SSLMODE: disable
    depends_on:
      - db
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    container_name: hockey-analytics-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: hockey_analytics
    ports:
      - "5432:5432"
    volumes:
      - hockey_postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  hockey_postgres_data: